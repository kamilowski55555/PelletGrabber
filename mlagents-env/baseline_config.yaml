behaviors:
  AgentController:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256 #
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-4
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 256 #
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 1.0e7
    time_horizon: 64
    summary_freq: 5000

environment_parameters:
  maze_difficulty:
    curriculum:
      - name: Lesson0_Straight # 3x1 area
        completion_criteria:
          measure: reward
          behavior: AgentController
          threshold: 0.8 # Wysoki próg dla prostej drogi
          min_lesson_length: 500
        value: 0.0
      - name: Lesson1_SmallSquare # 3x3 area
        completion_criteria:
          measure: reward
          behavior: AgentController
          threshold: 0.7
          min_lesson_length: 500
        value: 1.0
      - name: Lesson2_Intermediate # 5x5 area
        completion_criteria:
          measure: reward
          behavior: AgentController
          threshold: 0.6 # Trudniejszy labirynt, próg nieco niższy
          min_lesson_length: 1000
        value: 2.0
      - name: Lesson3_FullMaze # 9x9 area (grid 11x11)
        value: 3.0